          '<span class="row-amt num">' + pctText(c.pct) + "</span></button>";
      }).join("")
    : '<div class="empty">' + svg(I.pie) + "<h3>Sin categorías</h3><p>Agrega la primera con el botón de abajo.</p></div>") + "</div>";
  out += '<p class="list-note">Estos porcentajes son la <b>plantilla</b>: se copian al crear un ingreso nuevo. ' +
    'Los ingresos que ya registraste conservan el reparto que tenían, para que puedas repartir uno distinto cuando lo necesites.</p>';
  if (state.incomes.length) {
    const n = state.incomes.length;
    out += '<button class="btn" data-action="apply-tpl" style="margin-top:2px">' +
      (n === 1 ? "Aplicar estos porcentajes al ingreso ya registrado"
               : "Aplicar estos porcentajes a los " + n + " ingresos ya registrados") + "</button>";
  }
  out += "</div>";

  out += '<div class="section"><h2>Formato del dinero</h2><div class="card" style="padding:14px 15px; display:flex; flex-direction:column; gap:13px">' +
    '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">' +
      '<div class="field"><label class="lbl" for="setSym">Símbolo</label>' +
        '<input class="input" id="setSym" value="' + esc(state.settings.symbol) + '" maxlength="4"></div>' +
      '<div class="field"><label class="lbl" for="setDec">Decimales</label>' +
        '<select class="input" id="setDec">' +
          [0,2].map(d => '<option value="' + d + '"' + (state.settings.decimals === d ? " selected" : "") + ">" + (d === 0 ? "Sin decimales" : "Dos") + "</option>").join("") +
        "</select></div>" +
    "</div>" +
    '<div class="field"><label class="lbl" for="setLoc">Separador de miles</label>' +
      '<select class="input" id="setLoc">' +
        [["es-CO","1.234.567 (punto)"],["en-US","1,234,567 (coma)"],["fr-FR","1 234 567 (espacio)"]]
          .map(o => '<option value="' + o[0] + '"' + (state.settings.locale === o[0] ? " selected" : "") + ">" + o[1] + "</option>").join("") +
      "</select></div>" +
    "</div></div>";

  out += '<div class="section"><h2>Tus datos</h2><div class="card" style="padding:14px 15px; display:flex; flex-direction:column; gap:10px">' +
    '<p class="list-note" style="padding:0">Todo se guarda solo en este teléfono. Nadie más lo ve, y si borras los datos del navegador se pierde: exporta un respaldo de vez en cuando.</p>' +
    '<button class="btn primary" data-action="excel" style="flex:none">Descargar reporte en Excel</button>' +
    '<p class="list-note" style="padding:0">Cuatro hojas: resumen por categoría, ingresos con su reparto, gastos uno por uno y el mes a mes.</p>' +
    '<div class="divider"></div>' +
    '<div style="display:flex; gap:9px; flex-wrap:wrap">' +
      '<button class="btn" style="flex:1" data-action="export">Exportar respaldo</button>' +
      '<button class="btn" style="flex:1" data-action="import">Restaurar</button>' +
    "</div>" +
    '<button class="btn danger" data-action="wipe">Borrar todo y empezar de cero</button>' +
    "</div></div>";

  out += '<p class="list-note" style="text-align:center; padding:4px 10px 0">Reparto de Ingresos · ' +
    state.incomes.length + " ingresos · " + state.expenses.length + " gastos</p>";
  return out;
}

/* ==========================================================================
   Hojas (modales)
   ========================================================================== */
const sheetRoot = document.getElementById("sheetRoot");
let closeSheet = null;

function openSheet({ title, body, foot, onMount, back, onClose }){
  if (closeSheet) closeSheet();
  sheetRoot.hidden = false;
  sheetRoot.innerHTML =
    '<div class="backdrop" data-close="1"></div>' +
    '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
      '<div class="sheet-head">' +
        (back ? '<button class="icon-btn" data-close="1" aria-label="Volver">' + svg(I.back) + "</button>" : "") +
        "<h2>" + esc(title) + "</h2>" +
        (back ? "" : '<button class="icon-btn" data-close="1" aria-label="Cerrar">' + svg(I.x) + "</button>") +
      "</div>" +
      '<div class="sheet-body">' + body + "</div>" +
      (foot ? '<div class="sheet-foot">' + foot + "</div>" : "") +
    "</div>";

  const onKey = e => { if (e.key === "Escape") closeSheet(); };
  document.addEventListener("keydown", onKey);
  closeSheet = () => {
    document.removeEventListener("keydown", onKey);
    sheetRoot.hidden = true; sheetRoot.innerHTML = ""; closeSheet = null;
    if (onClose) onClose();
  };
  if (onMount) onMount(sheetRoot);
}

function confirmSheet(title, msg, okLabel, danger){
  return new Promise(resolve => {
    let accepted = false;
    openSheet({
      title,
      body: '<p style="margin:0; font-size:14px; line-height:1.55; color:var(--ink-2)">' + msg + "</p>",
      foot: '<button class="btn ghost" data-close="1" style="flex:1">Cancelar</button>' +
            '<button class="btn ' + (danger ? "danger" : "primary") + '" id="okBtn" style="flex:1">' + esc(okLabel) + "</button>",
      onMount(root){
        root.querySelector("#okBtn").onclick = () => { accepted = true; closeSheet(); };
      },
      onClose(){ resolve(accepted); }
    });
  });
}

/* ---------- hoja: ingreso ---------- */
function sheetIncome(existing){
  const draft = existing
    ? { id: existing.id, desc: existing.desc, amount: existing.amount, date: existing.date, alloc: Object.assign({}, existing.alloc) }
    : { id: null, desc: "", amount: 0, date: todayISO(),
        alloc: Object.fromEntries(state.categories.map(c => [c.id, c.pct])) };

  const allocRows = () => state.categories.map(c =>
    '<div class="alloc-row" data-cat="' + c.id + '">' +
      '<div class="alloc-info"><div class="n"><i class="dot" style="background:' + catVar(c.color) + '"></i>' + esc(c.name) + "</div>" +
      '<div class="a" data-amt></div></div>' +
      '<button class="btn-sm" data-rest="' + c.id + '" title="Asignar el porcentaje que queda">Resto</button>' +
      '<div class="pct-box"><input type="number" inputmode="numeric" min="0" max="100" step="1" ' +
        'value="' + (draft.alloc[c.id] || 0) + '" data-pct="' + c.id + '" aria-label="Porcentaje para ' + esc(c.name) + '"><span>%</span></div>' +
    "</div>").join("");

  const body =
    '<div class="field"><label class="lbl" for="fAmt">Valor del ingreso</label>' +
      '<input class="input amount" id="fAmt" type="text" inputmode="decimal" placeholder="0" ' +
        'value="' + (existing ? existing.amount : "") + '">' +
      '<div class="hint" id="fAmtHint"></div></div>' +
    '<div style="display:grid; grid-template-columns:1.4fr 1fr; gap:10px">' +
      '<div class="field"><label class="lbl" for="fDesc">Concepto</label>' +
        '<input class="input" id="fDesc" placeholder="Sueldo, freelance…" value="' + esc(draft.desc) + '"></div>' +
      '<div class="field"><label class="lbl" for="fDate">Fecha</label>' +
        '<input class="input" id="fDate" type="date" value="' + draft.date + '"></div>' +
    "</div>" +
    '<div class="divider"></div>' +
    '<div><div class="alloc-head">' +
      '<div style="display:flex; justify-content:space-between; align-items:center; gap:10px">' +
        '<span class="lbl">Reparto de este ingreso</span>' +
        '<button class="btn-sm" id="tplBtn">Usar plantilla</button></div>' +
      '<div class="alloc-status" id="allocStatus"></div>' +
    "</div>" +
    (state.categories.length ? allocRows() :
      '<p class="list-note">No tienes categorías. Créalas en Ajustes para poder repartir.</p>') +
    "</div>";

  const foot =
    (existing ? '<button class="btn danger" id="delBtn" style="flex:none">Eliminar</button>' : "") +
    '<button class="btn primary" id="saveBtn">' + (existing ? "Guardar cambios" : "Agregar ingreso") + "</button>";

  openSheet({
    title: existing ? "Editar ingreso" : "Nuevo ingreso",
    body, foot,
    onMount(root){
      const amtEl = root.querySelector("#fAmt");
      const hintEl = root.querySelector("#fAmtHint");
      const statusEl = root.querySelector("#allocStatus");

      function refresh(){
        hintEl.textContent = draft.amount > 0 ? money(draft.amount) : "Escribe cuánto entró";
        hintEl.className = "hint" + (draft.amount > 0 ? " pos" : "");
        const sum = state.categories.reduce((a, c) => a + (draft.alloc[c.id] || 0), 0);
        const libre = Math.round((100 - sum) * 10) / 10;
        statusEl.className = "alloc-status " + (Math.abs(libre) < 0.05 ? "ok" : "warn");
        statusEl.innerHTML = "<span>Repartido <b>" + pctText(sum) + "</b></span>" +
          "<span>" + (Math.abs(libre) < 0.05 ? "Reparto completo" : "Queda por repartir <b>" + pctText(libre) + "</b> · " + money(draft.amount * libre / 100)) + "</span>";
        root.querySelectorAll("[data-cat]").forEach(rowEl => {
          const id = rowEl.dataset.cat, p = draft.alloc[id] || 0;
          const a = rowEl.querySelector("[data-amt]");
          a.textContent = p > 0 ? money(draft.amount * p / 100) : "—";
          a.className = "a" + (p > 0 && draft.amount > 0 ? " on" : "");
        });
      }

      amtEl.addEventListener("input", () => { draft.amount = Math.abs(parseNum(amtEl.value)); refresh(); });
      amtEl.addEventListener("blur", () => { if (draft.amount > 0) amtEl.value = String(roundMoney(draft.amount)); });
      root.querySelector("#fDesc").addEventListener("input", e => draft.desc = e.target.value);
      root.querySelector("#fDate").addEventListener("change", e => draft.date = e.target.value || todayISO());

      root.querySelectorAll("[data-pct]").forEach(el => {
        el.addEventListener("input", () => {
          let v = Math.max(0, Math.min(100, parseNum(el.value)));
          const others = state.categories.reduce((a, c) => a + (c.id === el.dataset.pct ? 0 : (draft.alloc[c.id] || 0)), 0);
          if (others + v > 100) { v = Math.max(0, 100 - others); el.value = v; }
          draft.alloc[el.dataset.pct] = v;
          refresh();
        });
      });
      root.querySelectorAll("[data-rest]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.rest;
          const others = state.categories.reduce((a, c) => a + (c.id === id ? 0 : (draft.alloc[c.id] || 0)), 0);
          draft.alloc[id] = Math.max(0, Math.round((100 - others) * 10) / 10);
          const inp = root.querySelector('[data-pct="' + id + '"]');
          if (inp) inp.value = draft.alloc[id];
          refresh();
        });
      });
      root.querySelector("#tplBtn").addEventListener("click", () => {
        state.categories.forEach(c => {
          draft.alloc[c.id] = c.pct;
          const inp = root.querySelector('[data-pct="' + c.id + '"]');
          if (inp) inp.value = c.pct;
        });
        refresh();
      });

      root.querySelector("#saveBtn").addEventListener("click", () => {
        draft.amount = roundMoney(Math.abs(draft.amount));
        if (!(draft.amount > 0)) { amtEl.focus(); hintEl.textContent = "El ingreso debe ser mayor que cero."; hintEl.className = "hint neg"; return; }
        const clean = {};
        state.categories.forEach(c => { const p = draft.alloc[c.id] || 0; if (p > 0) clean[c.id] = p; });
        if (existing) {
          Object.assign(existing, { desc: draft.desc.trim(), amount: draft.amount, date: draft.date, alloc: clean });
        } else {
          state.incomes.push({ id: uid(), desc: draft.desc.trim(), amount: draft.amount, date: draft.date, alloc: clean });
        }
        save(); closeSheet(); render();
      });

      const del = root.querySelector("#delBtn");
      if (del) del.addEventListener("click", async () => {
        const ok = await confirmSheet("Eliminar ingreso",
          "Se quitará <b>" + money(existing.amount) + "</b> del saldo total y de las categorías a las que lo repartiste. Los gastos que ya registraste no cambian.",
          "Eliminar", true);
        if (ok) { state.incomes = state.incomes.filter(i => i.id !== existing.id); save(); render(); }
      });

      refresh();
      if (!existing) setTimeout(() => amtEl.focus(), 60);
    }
  });
}

/* ---------- hoja: gasto ---------- */
function sheetExpense(existing, presetCat){
  if (!state.categories.length) {
    openSheet({ title:"Falta una categoría",
      body:'<p style="margin:0;font-size:14px;color:var(--ink-2);line-height:1.55">Antes de registrar un gasto necesitas al menos una categoría general. Créala en la pestaña Ajustes.</p>',
      foot:'<button class="btn primary" data-close="1">Entendido</button>' });
    return;
  }

  const t0 = totals();
  const draft = existing
    ? { desc: existing.desc, amount: existing.amount, date: existing.date, catId: existing.catId, subId: existing.subId }
    : { desc: "", amount: 0, date: todayISO(), catId: presetCat || state.categories[0].id, subId: null };
  if (!catById(draft.catId)) draft.catId = state.categories[0].id;
  if (!existing) { const c0 = catById(draft.catId); draft.subId = c0.subs.length ? c0.subs[0].id : null; }

  const subOptions = () => {
    const c = catById(draft.catId);
    if (!c || !c.subs.length) return '<option value="">Sin subcategoría</option>';
    return c.subs.map(s => '<option value="' + s.id + '"' + (s.id === draft.subId ? " selected" : "") + ">" + esc(s.name) + "</option>").join("");
  };

  const body =
    '<div class="field"><label class="lbl" for="gAmt">Valor del gasto</label>' +
      '<input class="input amount" id="gAmt" type="text" inputmode="decimal" placeholder="0" value="' + (existing ? existing.amount : "") + '">' +
      '<div class="hint" id="gAmtHint"></div></div>' +
    '<div class="field"><label class="lbl" for="gCat">Categoría general</label>' +
      '<select class="input" id="gCat">' + state.categories.map(c =>
        '<option value="' + c.id + '"' + (c.id === draft.catId ? " selected" : "") + ">" + esc(c.name) + "</option>").join("") + "</select>" +
      '<div class="hint" id="gBal"></div></div>' +
    '<div class="field"><label class="lbl" for="gSub">Subcategoría</label>' +
      '<select class="input" id="gSub">' + subOptions() + "</select></div>" +
    '<div style="display:grid; grid-template-columns:1.4fr 1fr; gap:10px">' +
      '<div class="field"><label class="lbl" for="gDesc">Detalle</label>' +
        '<input class="input" id="gDesc" placeholder="Opcional" value="' + esc(draft.desc) + '"></div>' +
      '<div class="field"><label class="lbl" for="gDate">Fecha</label>' +
        '<input class="input" id="gDate" type="date" value="' + draft.date + '"></div>' +
    "</div>";

  const foot =
    (existing ? '<button class="btn danger" id="gDel" style="flex:none">Eliminar</button>' : "") +
    '<button class="btn primary" id="gSave">' + (existing ? "Guardar cambios" : "Registrar gasto") + "</button>";

  openSheet({
    title: existing ? "Editar gasto" : "Nuevo gasto",
    body, foot,
    onMount(root){
      const amtEl = root.querySelector("#gAmt"), hintEl = root.querySelector("#gAmtHint"), balEl = root.querySelector("#gBal");
      const catEl = root.querySelector("#gCat"), subEl = root.querySelector("#gSub");

      function refresh(){
        hintEl.textContent = draft.amount > 0 ? money(draft.amount) : "Escribe cuánto gastaste";
        hintEl.className = "hint" + (draft.amount > 0 ? " neg" : "");
        const info = t0.cats.find(x => x.cat.id === draft.catId);
        const base = info ? info.saldo + (existing && existing.catId === draft.catId ? existing.amount : 0) : 0;
        const after = base - draft.amount;
        balEl.textContent = "Saldo de la categoría: " + money(base) + (draft.amount > 0 ? "  →  " + money(after) : "");
        balEl.className = "hint" + (after < -0.004 ? " neg" : "");
      }

      amtEl.addEventListener("input", () => { draft.amount = Math.abs(parseNum(amtEl.value)); refresh(); });
      amtEl.addEventListener("blur", () => { if (draft.amount > 0) amtEl.value = String(roundMoney(draft.amount)); });
      catEl.addEventListener("change", () => {
        draft.catId = catEl.value;
        const c = catById(draft.catId);
        draft.subId = c && c.subs.length ? c.subs[0].id : null;
        subEl.innerHTML = subOptions();
        refresh();
      });
      subEl.addEventListener("change", () => draft.subId = subEl.value || null);
      root.querySelector("#gDesc").addEventListener("input", e => draft.desc = e.target.value);
      root.querySelector("#gDate").addEventListener("change", e => draft.date = e.target.value || todayISO());

      root.querySelector("#gSave").addEventListener("click", () => {
        draft.amount = roundMoney(Math.abs(draft.amount));
        if (!(draft.amount > 0)) { amtEl.focus(); hintEl.textContent = "El gasto debe ser mayor que cero."; hintEl.className = "hint neg"; return; }
        if (existing) Object.assign(existing, { desc: draft.desc.trim(), amount: draft.amount, date: draft.date, catId: draft.catId, subId: draft.subId });
        else state.expenses.push({ id: uid(), desc: draft.desc.trim(), amount: draft.amount, date: draft.date, catId: draft.catId, subId: draft.subId });
        save(); closeSheet(); render();
      });

      const del = root.querySelector("#gDel");
      if (del) del.addEventListener("click", async () => {
        const ok = await confirmSheet("Eliminar gasto",
          "Se devolverán <b>" + money(existing.amount) + "</b> al saldo de la categoría y al saldo total.", "Eliminar", true);
        if (ok) { state.expenses = state.expenses.filter(x => x.id !== existing.id); save(); render(); }
      });

      refresh();
      if (!existing) setTimeout(() => amtEl.focus(), 60);
    }
  });
}

/* ---------- hoja: detalle de categoría ---------- */
function sheetCatDetail(catId){
  const c = catById(catId); if (!c) return;
  const t = totals();
  const info = t.cats.find(x => x.cat.id === catId);
  const mine = state.expenses.filter(e => e.catId === catId).sort((a, b) => b.date.localeCompare(a.date));

  const bySub = c.subs.map(s => ({ sub: s, total: mine.filter(e => e.subId === s.id).reduce((a, e) => a + e.amount, 0) }));
  const sinSub = mine.filter(e => !e.subId || !c.subs.some(s => s.id === e.subId)).reduce((a, e) => a + e.amount, 0);
  if (sinSub > 0) bySub.push({ sub: { id: null, name: "Sin subcategoría" }, total: sinSub });
  bySub.sort((a, b) => b.total - a.total);
  const maxSub = Math.max(1, ...bySub.map(x => x.total));

  let body =
    '<div style="display:flex; flex-direction:column; gap:3px">' +
      '<span class="lbl">Saldo de ' + esc(c.name) + "</span>" +
      '<div class="hero-figure' + (info.saldo < 0 ? " neg" : "") + '" style="font-size:32px">' + money(info.saldo) + "</div>" +
    "</div>" +
    "<div>" +
      '<div class="stat-line"><span>Recibido de tus ingresos</span><b class="pos">' + money(info.asignado) + "</b></div>" +
      '<div class="stat-line"><span>Gastado</span><b class="neg">' + money(info.gastado) + "</b></div>" +
      '<div class="stat-line"><span>Porcentaje sugerido</span><b>' + pctText(c.pct) + "</b></div>" +
    "</div>";

  if (bySub.some(x => x.total > 0)) {
    body += '<div><span class="lbl" style="display:block; margin-bottom:9px">En qué se fue</span>' +
      bySub.filter(x => x.total > 0).map(x =>
        '<div style="margin-bottom:11px">' +
          '<div style="display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:5px">' +
            "<span>" + esc(x.sub.name) + '</span><b class="num">' + money(x.total) + "</b></div>" +
          '<div class="bar" style="--c:' + catVar(c.color) + '"><i style="width:' + (x.total / maxSub * 100) + '%"></i></div>' +
        "</div>").join("") + "</div>";
  } else {
    body += '<p class="list-note">Todavía no hay gastos en esta categoría.</p>';
  }

  if (mine.length) {
    body += '<div><span class="lbl" style="display:block; margin-bottom:8px">Últimos movimientos</span><div class="card">' +
      mine.slice(0, 8).map(e =>
        '<button class="row" data-action="edit-expense" data-id="' + e.id + '">' +
          '<div class="row-main"><div class="row-title">' + esc(e.desc || subName(c, e.subId)) + "</div>" +
          '<div class="row-sub">' + niceDate(e.date) + " · " + esc(subName(c, e.subId)) + "</div></div>" +
          '<span class="row-amt out">−' + money(e.amount).replace("−", "") + "</span></button>").join("") +
      "</div></div>";
  }

  openSheet({
    title: c.name, body,
    foot: '<button class="btn" id="cdEdit" style="flex:1">Editar categoría</button>' +
          '<button class="btn primary" id="cdSpend" style="flex:1">Registrar gasto</button>',
    onMount(root){
      root.querySelector("#cdEdit").onclick = () => { closeSheet(); sheetCategory(c); };
      root.querySelector("#cdSpend").onclick = () => { closeSheet(); sheetExpense(null, c.id); };
    }
  });
}

/* ---------- hoja: categoría ---------- */
function sheetCategory(existing){
  const draft = existing
    ? { name: existing.name, color: existing.color, pct: existing.pct, subs: existing.subs.map(s => ({ id: s.id, name: s.name })) }
    : { name: "", color: PALETTE[state.categories.length % PALETTE.length], pct: 0, subs: [] };

  const body =
    '<div class="field"><label class="lbl" for="cName">Nombre</label>' +
      '<input class="input" id="cName" placeholder="Ahorro, Inversión, Necesidades…" value="' + esc(draft.name) + '"></div>' +
    '<div class="field"><span class="lbl">Color</span><div class="swatches" id="cSwatches">' +
      PALETTE.map(col => '<button class="swatch" style="--c:' + catVar(col) + '" data-color="' + col + '" ' +
        'aria-pressed="' + (col.toLowerCase() === draft.color.toLowerCase()) + '" aria-label="Color ' + col + '">' + svg(I.check) + "</button>").join("") +
    "</div></div>" +
    '<div class="field"><label class="lbl" for="cPct">Porcentaje sugerido</label>' +
      '<div class="pct-box" style="align-self:flex-start"><input id="cPct" type="number" inputmode="numeric" min="0" max="100" value="' + draft.pct + '"><span>%</span></div>' +
      '<div class="hint">Es el valor que aparece marcado al crear un ingreso. Siempre lo puedes cambiar ingreso por ingreso.</div></div>' +
    '<div class="divider"></div>' +
    '<div class="field"><span class="lbl">Subcategorías</span>' +
      '<div class="subs" id="cSubs"></div>' +
      '<div class="add-inline" style="margin-top:8px">' +
        '<input class="input" id="cSubNew" placeholder="Agregar subcategoría">' +
        '<button class="btn" id="cSubAdd" style="flex:none">Agregar</button></div>' +
      '<div class="hint">Los gastos se registran en una subcategoría y descuentan de esta categoría.</div></div>';

  const foot =
    (existing ? '<button class="btn danger" id="cDel" style="flex:none">Eliminar</button>' : "") +
    '<button class="btn primary" id="cSave">' + (existing ? "Guardar" : "Crear categoría") + "</button>";

  openSheet({
    title: existing ? "Editar categoría" : "Nueva categoría",
    body, foot,
    onMount(root){
      const subsEl = root.querySelector("#cSubs"), newEl = root.querySelector("#cSubNew");

      function drawSubs(){
        subsEl.innerHTML = draft.subs.length
          ? draft.subs.map((s, i) => '<span class="sub-chip">' + esc(s.name) +
              '<button data-rm="' + i + '" aria-label="Quitar ' + esc(s.name) + '">' + svg(I.x) + "</button></span>").join("")
          : '<span class="hint" style="padding:0">Sin subcategorías todavía.</span>';
        subsEl.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { draft.subs.splice(Number(b.dataset.rm), 1); drawSubs(); });
      }
      function addSub(){
        const n = newEl.value.trim();
        if (!n) return;
        draft.subs.push({ id: uid(), name: n });
        newEl.value = ""; newEl.focus(); drawSubs();
      }
      drawSubs();
      root.querySelector("#cSubAdd").onclick = addSub;
      newEl.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addSub(); } });

      root.querySelectorAll("[data-color]").forEach(b => b.onclick = () => {
        draft.color = b.dataset.color;
        root.querySelectorAll("[data-color]").forEach(x => x.setAttribute("aria-pressed", x === b));
      });

      root.querySelector("#cSave").onclick = () => {
        const nameEl = root.querySelector("#cName");
        draft.name = nameEl.value.trim();
        draft.pct = Math.max(0, Math.min(100, parseNum(root.querySelector("#cPct").value)));
        if (!draft.name) { nameEl.focus(); return; }
        if (existing) {
          const gone = existing.subs.filter(s => !draft.subs.some(d => d.id === s.id)).map(s => s.id);
          state.expenses.forEach(e => { if (e.catId === existing.id && gone.includes(e.subId)) e.subId = null; });
          Object.assign(existing, draft);
        } else {
          state.categories.push({ id: uid(), name: draft.name, color: draft.color, pct: draft.pct, subs: draft.subs });
        }
        save(); closeSheet(); render();
      };

      const del = root.querySelector("#cDel");
      if (del) del.onclick = async () => {
        const nExp = state.expenses.filter(e => e.catId === existing.id).length;
        const nInc = state.incomes.filter(i => i.alloc && i.alloc[existing.id] > 0).length;
        const ok = await confirmSheet("Eliminar " + existing.name,
          "Se borrarán <b>" + nExp + (nExp === 1 ? " gasto" : " gastos") + "</b> de esta categoría y se quitará su parte en <b>" +
          nInc + (nInc === 1 ? " ingreso" : " ingresos") + "</b>. Ese porcentaje quedará sin asignar y volverá al saldo total.",
          "Eliminar", true);
        if (!ok) return;
        state.expenses = state.expenses.filter(e => e.catId !== existing.id);
        state.incomes.forEach(i => { if (i.alloc) delete i.alloc[existing.id]; });
        state.categories = state.categories.filter(c => c.id !== existing.id);
        save(); render();
      };

      if (!existing) setTimeout(() => root.querySelector("#cName").focus(), 60);
    }
  });
}

/* ---------- respaldos ---------- */
async function exportData(){
  const json = JSON.stringify(state, null, 2);
  const filename = "reparto-" + todayISO() + ".json";
  let saved = false;
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl) { await dl.save({ filename, data: json }); saved = true; }
  } catch (e) { saved = false; }
  if (!saved) {
    try {
      const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
      const a = document.createElement("a");
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      saved = true;
    } catch (e) { saved = false; }
  }
  if (!saved) {
    openSheet({
      title: "Copia tu respaldo",
      body: '<p class="list-note" style="padding:0">Este navegador no permite descargar el archivo. Copia el texto y guárdalo donde quieras.</p>' +
        '<textarea class="input" readonly rows="10" style="font-family:monospace; font-size:11px; resize:vertical">' + esc(json) + "</textarea>",
      foot: '<button class="btn primary" data-close="1">Listo</button>'
    });
  }
}

function importData(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = async () => {
      let incoming;
      try { incoming = JSON.parse(String(r.result)); } catch (e) { incoming = null; }
      if (!incoming || !Array.isArray(incoming.categories)) {
        openSheet({ title:"Archivo no válido",
          body:'<p style="margin:0;font-size:14px;color:var(--ink-2)">Ese archivo no es un respaldo de Reparto. Busca uno con nombre <b>reparto-…json</b>.</p>',
          foot:'<button class="btn primary" data-close="1">Entendido</button>' });
        return;
      }
      const ok = await confirmSheet("Restaurar respaldo",
        "Se reemplazarán tus datos actuales por los del archivo: <b>" + (incoming.incomes || []).length +
        " ingresos</b> y <b>" + (incoming.expenses || []).length + " gastos</b>. Esto no se puede deshacer.",
        "Restaurar", true);
      if (!ok) return;
      state = incoming;
      state.settings = Object.assign({ symbol:"$", decimals:0, locale:"es-CO" }, state.settings);
      state.incomes = state.incomes || []; state.expenses = state.expenses || [];
      state.categories.forEach(c => { c.subs = c.subs || []; c.color = normColor(c.color); });
      save(); render();
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ==========================================================================
   Reporte en Excel (.xlsx escrito a mano: sin librerías, funciona sin internet)
   ========================================================================== */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(buf){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
const utf8 = s => new TextEncoder().encode(s);

/* ZIP sin compresión (método 0): Excel lo abre igual y evita traer un deflate */
function zipStore(files){
  const u16 = n => [n & 255, (n >> 8) & 255];
  const u32 = n => [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >> 24) & 255];
  const DOS_TIME = 0, DOS_DATE = 0x21; /* 1980-01-01 */
  const parts = [], dir = [];
  let offset = 0;

  files.forEach(f => {
    const name = utf8(f.name), crc = crc32(f.data), len = f.data.length;
    const head = new Uint8Array([].concat(
      u32(0x04034b50), u16(20), u16(0), u16(0), u16(DOS_TIME), u16(DOS_DATE),
      u32(crc), u32(len), u32(len), u16(name.length), u16(0)));
    parts.push(head, name, f.data);
    dir.push({ name, crc, len, offset });
    offset += head.length + name.length + len;
  });

  let dirLen = 0;
  dir.forEach(d => {
    const head = new Uint8Array([].concat(
      u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(DOS_TIME), u16(DOS_DATE),
      u32(d.crc), u32(d.len), u32(d.len), u16(d.name.length), u16(0), u16(0), u16(0), u16(0),
      u32(0), u32(d.offset)));
    parts.push(head, d.name);
    dirLen += head.length + d.name.length;
  });
  parts.push(new Uint8Array([].concat(
    u32(0x06054b50), u16(0), u16(0), u16(dir.length), u16(dir.length),
    u32(dirLen), u32(offset), u16(0))));

  const total = parts.reduce((a, p) => a + p.length, 0), out = new Uint8Array(total);
  let p = 0;
  parts.forEach(part => { out.set(part, p); p += part.length; });
  return out;
}

const xmlEsc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&apos;" }[c]));
function colName(i){
  let s = "", n = i + 1;
  while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; }
  return s;
}
/* Excel cuenta días desde el 30/12/1899 */
function excelDate(iso){
  const [y, m, d] = String(iso).split("-").map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 86400000);
}

/* estilos: 0 normal · 1 encabezado · 2 dinero · 3 fecha · 4 dinero en negrita · 5 porcentaje */
const S = { TXT:0, HEAD:1, MONEY:2, DATE:3, TOTAL:4, PCT:5 };
const txt = v => ({ s: S.TXT, str: v });
const head = v => ({ s: S.HEAD, str: v });
const cash = (v, bold) => ({ s: bold ? S.TOTAL : S.MONEY, num: roundMoney(v) });
const day = v => ({ s: S.DATE, num: excelDate(v) });
const pct = v => ({ s: S.PCT, num: v });

function sheetXML(sheet){
  const rows = sheet.rows.map((cells, r) => {
    const cs = cells.map((cell, i) => {
      if (cell == null || cell === "") return "";
      const c = typeof cell === "object" ? cell : txt(cell);
      const ref = colName(i) + (r + 1);
      if (c.num != null && isFinite(c.num))
        return '<c r="' + ref + '" s="' + c.s + '"><v>' + c.num + "</v></c>";
      return '<c r="' + ref + '" s="' + c.s + '" t="inlineStr"><is><t xml:space="preserve">' +
        xmlEsc(c.str == null ? "" : c.str) + "</t></is></c>";
    }).join("");
    return '<row r="' + (r + 1) + '">' + cs + "</row>";
  }).join("");

  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' +
    '<cols>' + sheet.cols.map((w, i) =>
      '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>').join("") + "</cols>" +
    "<sheetData>" + rows + "</sheetData></worksheet>";
}

  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +

      '<numFmt numFmtId="164" formatCode="' + money + '"/>' +
      '<numFmt numFmtId="165" formatCode="dd/mm/yyyy"/>' +

    "</numFmts>" +
    '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>' +
      '<font><b/><sz val="11"/><color rgb="FF0E3B31"/><name val="Calibri"/></font></fonts>' +
    '<fills count="3"><fill><patternFill patternType="none"/></fill>' +
      '<fill><patternFill patternType="gray125"/></fill>' +
      '<fill><patternFill patternType="solid"><fgColor rgb="FFDBEDE6"/><bgColor indexed="64"/></patternFill></fill></fills>' +
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="6">' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
      '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>' +
      '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
      '<xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
      '<xf numFmtId="164" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/>' +
      '<xf numFmtId="166" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
    "</cellXfs>" +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
}

function buildXlsx(sheets){
  const files = [
    { name: "[Content_Types].xml", data: utf8(
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      sheets.map((s, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) +
        '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("") +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      "</Types>") },
    { name: "_rels/.rels", data: utf8(
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      "</Relationships>") },
    { name: "xl/workbook.xml", data: utf8(
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"' +
      ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
      sheets.map((s, i) => '<sheet name="' + xmlEsc(s.name) + '" sheetId="' + (i + 1) +
        '" r:id="rId' + (i + 1) + '"/>').join("") +
      "</sheets></workbook>") },
    { name: "xl/_rels/workbook.xml.rels", data: utf8(
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      sheets.map((s, i) => '<Relationship Id="rId' + (i + 1) +
        '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' +
        (i + 1) + '.xml"/>').join("") +
      '<Relationship Id="rId' + (sheets.length + 1) +
      '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      "</Relationships>") },
    { name: "xl/styles.xml", data: utf8(stylesXML()) }
  ];
  sheets.forEach((s, i) => files.push({ name: "xl/worksheets/sheet" + (i + 1) + ".xml", data: utf8(sheetXML(s)) }));
  return zipStore(files);
}

/* ---------- las hojas del reporte ---------- */
function reportSheets(){
  const t = totals();
  const cats = state.categories;
  const hoy = todayISO();

  /* 1. Resumen */
  const resumen = { name: "Resumen", cols: [26, 16, 16, 16, 10], rows: [] };
  resumen.rows.push([head("Reparto de ingresos"), head("Reporte del " + hoy), "", "", ""]);
  resumen.rows.push([]);
  resumen.rows.push([txt("Entró"), cash(t.ingreso, true)]);
  resumen.rows.push([txt("Salió"), cash(t.gastado, true)]);
  resumen.rows.push([txt("Saldo disponible"), cash(t.saldo, true)]);
  resumen.rows.push([txt("Sin repartir"), cash(Math.max(0, t.sinAsignar), true)]);
  if (t.huerfano > 0.004) resumen.rows.push([txt("Gastos sin categoría"), cash(t.huerfano, true)]);
  resumen.rows.push([]);
  resumen.rows.push([head("Categoría"), head("Asignado"), head("Gastado"), head("Saldo"), head("Plan")]);
  t.cats.forEach(c => resumen.rows.push([
    txt(c.cat.name), cash(c.asignado), cash(c.gastado), cash(c.saldo), pct(c.cat.pct)
  ]));
  resumen.rows.push([txt("Total"), cash(t.asignadoTotal, true), cash(t.gastado, true), cash(t.asignadoTotal - t.gastado, true), ""]);

  /* 2. Ingresos, con una columna por categoría */
  const ingresos = { name: "Ingresos", cols: [12, 24, 16].concat(cats.map(() => 15)), rows: [] };
  ingresos.rows.push([head("Fecha"), head("Descripción"), head("Monto")].concat(cats.map(c => head(c.name))));
  state.incomes.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(i => {
    ingresos.rows.push([day(i.date), txt(i.desc || "Ingreso"), cash(i.amount)]
      .concat(cats.map(c => cash(i.amount * ((i.alloc && i.alloc[c.id]) || 0) / 100))));
  });
  ingresos.rows.push([txt(""), txt("Total"), cash(t.ingreso, true)]
    .concat(t.cats.map(c => cash(c.asignado, true))));

  /* 3. Gastos, uno por fila */
  const gastos = { name: "Gastos", cols: [12, 18, 20, 26, 16], rows: [] };
  gastos.rows.push([head("Fecha"), head("Categoría"), head("Subcategoría"), head("Descripción"), head("Monto")]);
  state.expenses.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(e => {
    const c = catById(e.catId);
    gastos.rows.push([day(e.date), txt(c ? c.name : "Sin categoría"), txt(subName(c, e.subId)),
      txt(e.desc || ""), cash(e.amount)]);
  });
  gastos.rows.push([txt(""), txt(""), txt(""), txt("Total"), cash(t.gastado, true)]);

  /* 4. Mes a mes */
  const meses = { name: "Mes a mes", cols: [14, 16, 16, 16], rows: [] };
  meses.rows.push([head("Mes"), head("Entró"), head("Salió"), head("Neto")]);
  const porMes = {};
  state.incomes.forEach(i => { const k = monthKey(i.date); (porMes[k] = porMes[k] || { i:0, g:0 }).i += i.amount; });
  state.expenses.forEach(e => { const k = monthKey(e.date); (porMes[k] = porMes[k] || { i:0, g:0 }).g += e.amount; });
  Object.keys(porMes).sort().forEach(k => {
    meses.rows.push([txt(k), cash(porMes[k].i), cash(porMes[k].g), cash(porMes[k].i - porMes[k].g)]);
  });
  meses.rows.push([txt("Total"), cash(t.ingreso, true), cash(t.gastado, true), cash(t.saldo, true)]);

  return [resumen, ingresos, gastos, meses];
}

/* guarda el archivo por la vía que soporte el teléfono */
async function saveFile(filename, data, mime){
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl) { await dl.save({ filename, data }); return true; }
  } catch (e) {}
  const blob = new Blob([data], { type: mime });
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  } catch (e) {}
  try {
    const file = new File([blob], filename, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: filename });
      return true;
    }
  } catch (e) {}
  return false;
}

async function exportExcel(){
  if (!state.incomes.length && !state.expenses.length) {
    openSheet({ title: "Todavía no hay nada que reportar",
      body: '<p class="list-note" style="padding:0">Registra al menos un ingreso o un gasto y el reporte saldrá con datos.</p>',
      foot: '<button class="btn primary" data-close="1">Entendido</button>' });
    return;
  }
  let ok = false;
  try {
    ok = await saveFile("reparto-" + todayISO() + ".xlsx", buildXlsx(reportSheets()),
      "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
  } catch (e) { ok = false; }
  if (!ok) {
    openSheet({ title: "No se pudo guardar",
      body: '<p class="list-note" style="padding:0">Este navegador bloqueó la descarga. Abre la app desde su enlace (no como archivo suelto) e inténtalo otra vez.</p>',
      foot: '<button class="btn primary" data-close="1">Entendido</button>' });
  }
}

/* ==========================================================================
   Eventos
   ========================================================================== */
document.getElementById("tabbar").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  tab = b.dataset.tab; render();
});

document.getElementById("fab").addEventListener("click", e => runAction(e.currentTarget.dataset.action));

view.addEventListener("click", e => {
  const b = e.target.closest("[data-action]"); if (!b) return;
  runAction(b.dataset.action, b.dataset.id);
});
sheetRoot.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) { if (closeSheet) closeSheet(); return; }
  const b = e.target.closest("[data-action]"); if (!b) return;
  runAction(b.dataset.action, b.dataset.id);
});

view.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "setDec") { state.settings.decimals = Number(el.value); save(); render(); }
  if (el.id === "setLoc") { state.settings.locale = el.value; save(); render(); }
});
const flowHover = e => { const b = e.target.closest("[data-flow]"); if (b) setFlow(Number(b.dataset.flow)); };
view.addEventListener("pointerover", flowHover);
view.addEventListener("focusin", flowHover);
view.addEventListener("pointerleave", () => { if (flowRows.length) setFlow(flowRows.length - 1); });

view.addEventListener("input", e => {
  if (e.target.id === "setSym") {
    state.settings.symbol = e.target.value;
    save();
    const t = totals(), top = document.getElementById("topTotal");
    top.textContent = money(t.saldo);
  }
});

async function runAction(action, id){
  switch (action) {
    case "new-income":    sheetIncome(null); break;
    case "edit-income":   sheetIncome(state.incomes.find(i => i.id === id)); break;
    case "new-expense":   sheetExpense(null); break;
    case "edit-expense":  sheetExpense(state.expenses.find(x => x.id === id)); break;
    case "new-category":  sheetCategory(null); break;
    case "edit-category": sheetCategory(catById(id)); break;
    case "cat-detail":    sheetCatDetail(id); break;
    case "toggle-table":  showTable = !showTable; render(); break;
    case "apply-tpl": {
      const plan = state.categories.reduce((a, c) => a + c.pct, 0);
      const ok = await confirmSheet("Aplicar la plantilla",
        (state.incomes.length === 1
          ? "El ingreso que ya registraste pasará"
          : "Los <b>" + state.incomes.length + "</b> ingresos que ya registraste pasarán") +
        " a repartirse con los porcentajes de ahora (" +
        state.categories.map(c => esc(c.name) + " " + pctText(c.pct)).join(", ") + ")." +
        (Math.abs(plan - 100) > 0.05 ? " Tu plantilla suma <b>" + pctText(plan) + "</b>, así que quedará ese resto sin repartir." : "") +
        " Si a algún ingreso le habías puesto un reparto propio, se pierde.",
        "Aplicar a todos");
      if (ok) {
        state.incomes.forEach(i => {
          i.alloc = Object.fromEntries(state.categories.map(c => [c.id, c.pct]));
        });
        save(); tab = "resumen"; render();
      }
      break;
    }
    case "excel":         await exportExcel(); break;
    case "export":        exportData(); break;
    case "import":        importData(); break;
    case "wipe": {
      const ok = await confirmSheet("Borrar todo",
        "Se eliminarán todos tus ingresos, gastos y categorías, y volverás a las categorías de ejemplo. Exporta un respaldo antes si tienes dudas.",
        "Borrar todo", true);
      if (ok) { state = seed(); save(); tab = "resumen"; render(); }
      break;
    }
  }
}

/* ---------- tema ---------- */
const THEMES = [
  { id:"auto",  icon:I.auto, label:"Tema del sistema" },
  { id:"light", icon:I.sun,  label:"Tema claro" },
  { id:"dark",  icon:I.moon, label:"Tema oscuro" }
];
let themeIdx = 0;
try { const t = localStorage.getItem(THEME_KEY); const i = THEMES.findIndex(x => x.id === t); if (i > -1) themeIdx = i; } catch (e) {}

function applyTheme(){
  const t = THEMES[themeIdx];
  if (t.id === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t.id);
  const btn = document.getElementById("themeBtn");
  btn.innerHTML = svg(t.icon);
  btn.title = t.label; btn.setAttribute("aria-label", t.label);
  try { localStorage.setItem(THEME_KEY, t.id); } catch (e) {}
}
document.getElementById("themeBtn").addEventListener("click", () => { themeIdx = (themeIdx + 1) % THEMES.length; applyTheme(); });

applyTheme();
render();
